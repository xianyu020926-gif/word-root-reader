services:
  app:
    build:
      context: ../..
      dockerfile: deploy/tencent-vps/Dockerfile
    restart: unless-stopped
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
    networks: [internal]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on: [app]
    environment:
      APP_HOST: ${APP_HOST:-:80}
      APP_AUTH_USER: ${APP_AUTH_USER}
      APP_AUTH_HASH: ${APP_AUTH_HASH}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

networks:
  internal:

volumes:
  caddy_data:
  caddy_config:
