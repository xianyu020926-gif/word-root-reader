    }

        font-size: 0.75em;

function findWordInfo(word) {
    var clean = word.replace(/[^a-zA-Z]/g, '').toLowerCase();
    if (!clean) return null;
    if (ALL_WORDS[clean]) return {type:'basic', data:ALL_WORDS[clean], word:clean};
    for (var key in ROOT_WORDS) {
        var data = ROOT_WORDS[key];
        for (var i = 0; i < data.variants.length; i++) {
            if (clean.indexOf(data.variants[i]) >= 0 && data.variants[i].length >= 3) {
                return {type:'root', data:data, word:clean};
            }
        }
    }
    return null;
}

    if (!text) return;
    panel.innerHTML = '';
    var tokens = text.split(/(\s+|(?=[.,!?;:'"()\[\]{}…—])|(?<=[.,!?;:'"()\[\]{}…—]))/g);
    tokens.forEach(function(token) {
        if (/^\s+$/.test(token)) {
            var span = document.createElement('span');
            span.innerHTML = token.replace(/\n/g, '<br>');
            panel.appendChild(span);
            return;
        }
        if (/[a-zA-Z]/.test(token)) {
            var span = document.createElement('span');
            span.textContent = token;
            span.className = 'word';
            var info = findWordInfo(token);
            if (info) {
                span.classList.add(info.type === 'basic' ? 'has-basic' : 'has-root');
                span.onclick = function(e) { e.stopPropagation(); showPopup(token, info, e.clientX, e.clientY); };
            }
            panel.appendChild(span);
        } else {
            panel.appendChild(document.createTextNode(token));
        }
    });
}

function showPopup(word, info, x, y) {
    var popup = document.getElementById('popup-card');
    var clean = word.replace(/[^a-zA-Z]/g, '');
    document.getElementById('popup-word').textContent = clean;
    if (info.type === 'basic') {
        document.getElementById('popup-pos').textContent = (info.data.pos||'') ? '词性：' + info.data.pos : '';
        document.getElementById('popup-meaning').textContent = '释义：' + (info.data.meaning||'暂无');
        document.getElementById('popup-breakdown').innerHTML = '';
        document.getElementById('popup-hook').textContent = '';
        document.getElementById('popup-variants').textContent = '';
    } else {
        document.getElementById('popup-pos').textContent = (info.data.pos||'') ? '词性：' + info.data.pos : '';
        document.getElementById('popup-meaning').textContent = '释义：' + (info.data.meaning||'暂无');
        document.getElementById('popup-breakdown').innerHTML = '词根核心：<span class="root-name">' + info.data.root + '</span>';
        document.getElementById('popup-hook').textContent = info.data.hook;
        document.getElementById('popup-variants').textContent = '变形家族：' + info.data.variants.join(' · ');
    }
    popup.style.display = 'block';
    var cw = popup.offsetWidth || 340;
    var ch = popup.offsetHeight || 200;
    popup.style.left = Math.min(x + 15, window.innerWidth - cw - 10) + 'px';
    popup.style.top = Math.min(y + 15, window.innerHeight - ch - 10) + 'px';
}

function hidePopup() { document.getElementById('popup-card').style.display = 'none'; }
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') hidePopup(); });
window.addEventListener('DOMContentLoaded', startReading);
</script>
